<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ORDnet</title>
<style>
/* Space Grotesk bundled locally (variable font, weights 300-700) — no remote font loading */
@font-face{font-family:'Space Grotesk';src:url('../fonts/space-grotesk.woff2') format('woff2-variations');font-weight:300 700;font-style:normal;font-display:swap;unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Space Grotesk';src:url('../fonts/space-grotesk-ext.woff2') format('woff2-variations');font-weight:300 700;font-style:normal;font-display:swap;unicode-range:U+0100-02AF,U+0300-0301,U+0303-0304,U+0308-0309,U+0323,U+0329,U+1E00-1EFF,U+2020,U+20A0-20AB,U+20AD-20CF,U+2113,U+2C60-2C7F,U+A720-A7FF}
:root {
  --bg-primary: #fcfaf5;
  --bg-secondary: #f5f3ed;
  --bg-card: rgba(255, 255, 255, 0.8);
  --bg-solid: #ffffff;
  --text-primary: #1a1a1a;
  --text-secondary: rgba(26, 26, 26, 0.55);
  --border-color: rgba(0, 0, 0, 0.08);
  --accent-gradient: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 50%, #404040 100%);
  --btn-text: #ffffff;
  --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.06);
  --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.1);
}
[data-theme="dark"] {
  --bg-primary: #0a0a0f;
  --bg-secondary: #12121a;
  --bg-card: rgba(255, 255, 255, 0.03);
  --bg-solid: #1a1a24;
  --text-primary: #ffffff;
  --text-secondary: rgba(255, 255, 255, 0.55);
  --border-color: rgba(255, 255, 255, 0.08);
  --accent-gradient: linear-gradient(135deg, #fcfaf5 0%, #d9d5cc 50%, #fcfaf5 100%);
  --btn-text: #1a1a1a;
  --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
  --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.4);
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: 'Space Grotesk', -apple-system, system-ui, sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  -webkit-font-smoothing: antialiased;
  position: fixed;
  width: 100%;
  transition: background-color 0.3s, color 0.3s;
}

/* ─── Toolbar ─────────────────────────────────────── */
.app-container { display: flex; flex-direction: column; height: 100%; }

.toolbar {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 12px;
  background: var(--bg-primary);
  border-bottom: 1px solid var(--border-color);
  backdrop-filter: blur(10px);
  flex-shrink: 0;
}

.toolbar-brand {
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  flex-shrink: 0;
}
.toolbar-brand .logo-icon {
  width: 32px; height: 32px;
  border-radius: 8px;
  display: block;
  object-fit: contain;
}
.toolbar-brand .logo-text {
  font-size: 15px; font-weight: 700; letter-spacing: -0.5px;
}

.nav-btn {
  width: 32px; height: 32px;
  border-radius: 8px; border: none;
  background: transparent;
  color: var(--text-secondary);
  font-size: 18px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.15s;
}
.nav-btn:hover { background: var(--bg-secondary); color: var(--text-primary); }
.nav-btn.active { color: var(--text-primary); }

.address-bar {
  flex: 1;
  display: flex;
  align-items: center;
  background: var(--bg-secondary);
  border: 1px solid var(--border-color);
  border-radius: 10px;
  padding: 0 12px;
  height: 36px;
  gap: 8px;
  transition: border-color 0.2s;
}
.address-bar:focus-within { border-color: var(--text-primary); }

.security-indicator { font-size: 14px; flex-shrink: 0; display: none; }
.security-indicator.visible { display: inline; }

.address-input {
  flex: 1; border: none; background: transparent;
  font-size: 13px; font-family: 'SF Mono', 'Fira Code', monospace;
  color: var(--text-primary); outline: none;
}
.address-input::placeholder { color: var(--text-secondary); }

.go-btn {
  padding: 6px 14px;
  background: var(--accent-gradient);
  color: var(--btn-text);
  border: none; border-radius: 8px;
  font-weight: 600; font-size: 13px;
  cursor: pointer; transition: all 0.2s;
  box-shadow: var(--shadow-sm);
}
.go-btn:hover { transform: translateY(-1px); }

/* Theme toggle */
.theme-toggle {
  display: flex; padding: 3px;
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: 16px;
}
.theme-btn {
  width: 26px; height: 26px;
  border-radius: 50%; border: none;
  background: transparent;
  color: var(--text-secondary);
  cursor: pointer; font-size: 14px;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s;
}
.theme-btn.active { background: var(--accent-gradient); color: var(--btn-text); }

/* ─── Content ─────────────────────────────────────── */
.content-frame { flex: 1; position: relative; overflow: hidden; }
.content-frame iframe { width: 100%; height: 100%; border: none; position: absolute; top: 0; left: 0; }

/* Loading bar */
.loading-bar {
  position: absolute; top: 0; left: 0; right: 0;
  height: 2px; background: var(--text-primary);
  transform: scaleX(0); transform-origin: left; z-index: 10;
}
.loading-bar.active { animation: loadPulse 1.5s ease-in-out infinite; }
@keyframes loadPulse { 0%{transform:scaleX(0)} 50%{transform:scaleX(.7)} 100%{transform:scaleX(1);opacity:0} }

/* Error bar */
.error-bar {
  background: var(--bg-secondary);
  color: #991b1b; padding: 10px 18px;
  font-size: 13px; text-align: center;
  display: none; flex-shrink: 0;
  border-bottom: 1px solid var(--border-color);
}
[data-theme="dark"] .error-bar { color: #fca5a5; }
.error-bar.visible { display: block; }

/* ─── Start Screen ────────────────────────────────── */
.start-screen {
  width: 100%; height: 100%; overflow-y: auto;
  padding: 60px 24px; position: absolute; top: 0; left: 0;
}
.hero { text-align: center; margin-bottom: 48px; }
.hero h1 { font-size: 32px; font-weight: 700; letter-spacing: -1px; margin-bottom: 8px; }
.hero p { font-size: 15px; color: var(--text-secondary); }
.section-label {
  font-size: 11px; text-transform: uppercase;
  letter-spacing: 1px; color: var(--text-secondary);
  margin: 24px 0 12px; font-weight: 500;
}
.app-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px;
}
.app-card {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: 14px; padding: 14px 10px;
  text-align: center; cursor: pointer;
  backdrop-filter: blur(10px);
  transition: all 0.2s;
}
.app-card:hover { border-color: var(--text-primary); transform: translateY(-2px); box-shadow: var(--shadow-sm); }
.app-card .icon {
  width: 48px; height: 48px;
  border-radius: 12px;
  background: var(--accent-gradient);
  color: var(--btn-text);
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto 8px;
}
.app-card .icon svg { display: block; }
.app-card .name { font-size: 12px; font-weight: 600; }

.app-card-clawd {
  background: #0d0d0d;
  border-color: rgba(255,68,68,0.25);
  color: #fff;
}
.app-card-clawd .name { color: #fff; }
.app-card-clawd .icon {
  background: linear-gradient(135deg, #cc0000, #ff4444);
  color: #fff;
}

/* Dev info */
.dev-info {
  position: absolute; bottom: 0; left: 0; right: 0;
  background: rgba(0,0,0,.9); color: #4ade80;
  font-family: 'SF Mono', monospace; font-size: 11px;
  padding: 6px 14px; display: none; gap: 20px; z-index: 20;
}
.dev-info.visible { display: flex; }
</style>
</head>
<body>
<div class="app-container">

  <!-- Toolbar -->
  <div class="toolbar">
    <div class="toolbar-brand" id="btnHome">
      <img class="logo-icon" src="../icons/icon128.png" alt="ORDnet">
      <div class="logo-text">ORD/net</div>
    </div>
    <button class="nav-btn" id="btnBack" title="Back">←</button>
    <button class="nav-btn" id="btnForward" title="Forward">→</button>
    <div class="address-bar">
      <span class="security-indicator" id="secIndicator">🔒</span>
      <input class="address-input" id="addressInput" placeholder=".web3 domain or TXID..." spellcheck="false" autocomplete="off">
    </div>
    <button class="go-btn" id="goBtn">Go</button>
    <button class="nav-btn" id="btnWallet" title="ORD/plug Wallet"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/></svg></button>
    <div class="theme-toggle">
      <button class="theme-btn active" id="lightBtn" title="Light">☀</button>
      <button class="theme-btn" id="darkBtn" title="Dark">☽</button>
    </div>
  </div>

  <!-- Error bar -->
  <div class="error-bar" id="errorBar"></div>

  <!-- Content -->
  <div class="content-frame">
    <div class="loading-bar" id="loadingBar"></div>
    <div class="start-screen" id="startScreen">
      <div class="hero">
        <img src="../icons/icon128.png" alt="ORDnet" style="width:64px;height:64px;border-radius:14px;display:block;margin:0 auto 12px;">
        <h1>ORD/net</h1>
        <p>Blockchain-native browsing via 1SatOrdinals</p>
      </div>
      <div id="appCatalog"></div>
    </div>
    <!-- K6 — allow-same-origin is GONE, and it must stay gone.
         Combined with allow-scripts it cancels the sandbox: a srcdoc document
         then inherits this page's origin, which is the extension origin, and
         on-chain HTML written by anyone at all could read chrome.storage and
         with it the unlocked session key. This page is web-accessible from
         every site, so that was reachable from any tab.
         Without allow-same-origin the inscription renders in an opaque origin:
         it can still run its own scripts, but it has no extension APIs, no
         access to this document, and no shared storage. -->
    <iframe id="viewFrame" style="display:none" sandbox="allow-scripts allow-downloads" referrerpolicy="no-referrer"></iframe>
    <div class="dev-info" id="devInfo"><span id="devType"></span><span id="devSize"></span><span id="devTxid"></span></div>
  </div>

</div>
<script src="viewer.js"></script>
</body>
</html>
